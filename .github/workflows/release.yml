name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Build signed release APK
        env:
          RELEASE_VERSION_CODE: ${{ github.run_number }}
          RELEASE_VERSION_NAME: "1.0.${{ github.run_number }}"
          UPDATE_CHECK_TOKEN: ${{ secrets.UPDATE_CHECK_TOKEN }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Essentials Family App - Build ${{ github.run_number }}

            ## What's New
            - Chore management with photo verification
            - Daily task tracking
            - Server sync with isaacs-hub-server

            ## Installation
            1. Download `essentials-family-app-release.apk`
            2. Enable "Install from Unknown Sources" in Android settings
            3. Install the APK
            4. Configure server connection in Setup screen

            **Version:** 1.0.${{ github.run_number }}
          files: |
            app/build/outputs/apk/release/app-release.apk
